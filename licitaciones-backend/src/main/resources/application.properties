# =====================================================================
# licitaciones-backend - application.properties
# Todas las claves criticas estan preparadas para ser sobreescritas por
# variables de entorno (${VAR:valorPorDefecto}), tal como se recomienda
# para despliegues en distintos ambientes (dev/qa/prod).
# =====================================================================

spring.application.name=licitaciones-backend
# PORT es la variable que inyecta Render (y otros PaaS) en tiempo de
# ejecucion; en local, sin esa variable definida, sigue cayendo en 8080.
server.port=${PORT:8080}

# ---------------------------------------------------------------------
# Datasource MySQL
#
# DB_HOST/DB_PORT/DB_NAME/DB_USERNAME/DB_PASSWORD son las variables que se
# configuran en Render (u otro ambiente) apuntando al MySQL de produccion
# (ej. Aiven). En local, sin esas variables definidas, cae en
# 127.0.0.1:3306/licitaciones_db con usuario "root" -- EXCEPTO la
# contrasena: no hay ninguna contrasena real hardcodeada aqui, asi que
# DB_PASSWORD debe definirse siempre, tambien en local (variable de
# entorno del sistema/IDE, nunca committeada).
#
# DB_SSL_MODE controla el modo TLS de MySQL Connector/J (sslMode, el
# reemplazo moderno de useSSL/requireSSL): "PREFERRED" por defecto negocia
# TLS si el servidor lo ofrece y si no, sigue funcionando sin TLS (asi el
# MySQL local, con o sin TLS configurado, sigue andando igual que antes).
# En Render, definir DB_SSL_MODE=REQUIRED para Aiven (o cualquier proveedor
# que exija TLS): la conexion falla en vez de caer a texto plano.
# ---------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:licitaciones_db}?sslMode=${DB_SSL_MODE:PREFERRED}&serverTimezone=UTC&createDatabaseIfNotExist=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------
# Carga de archivos (documentos del proceso enviados desde el frontend)
# ---------------------------------------------------------------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:300MB}

# ---------------------------------------------------------------------
# Integracion con n8n
#
# El default de abajo YA es el path de PRODUCCION ("/webhook/..."):
# requiere que el workflow este ACTIVADO en n8n (toggle
# arriba a la derecha del editor), si no, n8n devuelve 404 "not
# registered" y el backend lo traduce en un 502 -- el mismo 502 que ve el
# frontend, sin relacion con la deserializacion de N8nAnalisisResponseDTO
# (ya auditada y verificada por separado).
#
# HISTORICO (referencia, ya NO es el default): "/webhook-test/..." es el
# path de TEST de n8n -- solo responde una vez despues de apretar "Execute
# workflow"/"Listen for test event" en el editor; fuera de eso devuelve
# 404 "not registered" igual que el de produccion sin activar. Confirmado
# empiricamente el 2026-08-13 contra la instancia real. Sirve para probar
# un workflow puntualmente desde el editor de n8n, pero nunca debe ser el
# default de esta app: si necesitas usarlo, sobreescribe
# N8N_WEBHOOK_ANALIZAR manualmente, solo para esa prueba.
# ---------------------------------------------------------------------
n8n.base-url=${N8N_BASE_URL:https://n8n-esencia-suite.zntoks.easypanel.host}
n8n.webhook-analizar=${N8N_WEBHOOK_ANALIZAR:/webhook/8b450eed-a90b-4575-a5ac-8a77c194fc80}
n8n.connect-timeout-ms=${N8N_CONNECT_TIMEOUT_MS:5000}
n8n.read-timeout-ms=${N8N_READ_TIMEOUT_MS:180000}

# ---------------------------------------------------------------------
# Generacion de Excel a partir de la plantilla oficial
# ---------------------------------------------------------------------
app.excel.template-path=${EXCEL_TEMPLATE_PATH:templates/excel/PlantillaLicitaciones.xlsx}
app.excel.output-dir=${EXCEL_OUTPUT_DIR:./generated/excel}

# ---------------------------------------------------------------------
# CORS (frontend React / Vite)
#
# allowed-origin: origen de desarrollo, siempre permitido.
# frontend-url: dominio de produccion (ej. https://mi-frontend.vercel.app),
# opcional -- vacio por defecto, se agrega como origen adicional SOLO si se
# define (ver CorsConfig). No reemplaza a allowed-origin: ambos quedan
# permitidos a la vez.
# ---------------------------------------------------------------------
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
app.cors.frontend-url=${FRONTEND_URL:}

# ---------------------------------------------------------------------
# Autenticacion JWT (ver paquetes auth/ y security/)
#
# "secret" firma los tokens emitidos por POST /api/auth/login: el valor
# por defecto de abajo es SOLO para desarrollo local (generado una unica
# vez para este repo) y NUNCA debe usarse en un ambiente real. En
# produccion/QA, definir SIEMPRE JWT_SECRET con un valor propio (32+ bytes
# aleatorios) como variable de entorno del servidor.
# ---------------------------------------------------------------------
jwt.secret=${JWT_SECRET:45ME7p5Lptrj69vaFSlLBhbsgNP8C7T3iEeStdmAnLt06j1oLA3mxRUeUALqvoqx}
jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# ---------------------------------------------------------------------
# Usuario administrador inicial (ver config.AdminUsuarioInitializer)
#
# NO existe endpoint de registro: este es el UNICO mecanismo para crear el
# primer usuario. Si ADMIN_PASSWORD no se define, el inicializador no crea
# ningun usuario (evita dejar una contrasena por defecto en el codigo).
# Se ejecuta una sola vez: si "usuarios" ya tiene ese username, no lo toca
# (no resetea la contrasena en cada arranque).
# ---------------------------------------------------------------------
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:}

# La autenticacion es 100% propia (tabla "usuarios" + JwtAuthenticationFilter,
# ver paquetes auth/ y security/), no se usa el AuthenticationManager/
# UserDetailsService estandar de Spring Security: se excluye su
# autoconfiguracion para no generar (ni imprimir en el log) un usuario en
# memoria con password aleatoria que nunca se usa.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# ---------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------
logging.level.com.licitaciones.backend=${LOG_LEVEL:INFO}
